<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Portfolio startet …</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f8fafc;
    --fg: #1a202c;
    --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #181a23; --fg: #e0e7ef; --accent: #a5b4fc; }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    text-align: center;
  }
  main { max-width: 26rem; }
  .mark {
    width: 2.5rem;
    height: 2.5rem;
    margin: 0 auto 1.75rem;
    border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--fg) 20%, transparent);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @media (prefers-reduced-motion: reduce) {
    .mark { animation: none; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(1.5rem, 5vw, 2.25rem);
    letter-spacing: -0.02em;
    margin: 0 0 0.75rem;
  }
  p {
    font-size: 0.95rem;
    line-height: 1.6;
    opacity: 0.7;
    margin: 0 0 2rem;
  }
  button {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    border: 1px solid color-mix(in srgb, var(--fg) 40%, transparent);
    background: transparent;
    color: var(--fg);
    padding: 0.85rem 2.25rem;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  button:hover {
    background: var(--fg);
    color: var(--bg);
    border-color: var(--fg);
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Einen Moment …</h1>
    <p>Die Seite startet gerade wieder hoch. Das dauert normalerweise nur ein paar Sekunden — diese Seite lädt automatisch neu, sobald es weitergeht.</p>
    <button type="button" onclick="location.reload()">Jetzt erneut versuchen</button>
  </main>
  <script>
    (function () {
      var delayMs = 4000;

      function poll() {
        fetch(location.href, { cache: 'no-store', method: 'GET' })
          .then(function (res) {
            if (res.status !== 502 && res.status !== 503 && res.status !== 504) {
              location.reload();
              return;
            }
            setTimeout(poll, delayMs);
          })
          .catch(function () {
            setTimeout(poll, delayMs);
          });
      }

      setTimeout(poll, delayMs);
    })();
  </script>
</body>
</html>
