<div class="site-wrapper">

  <!-- Navigation -->
  <header class="site-header">
    <div class="nav-inner">
      <a routerLink="/" class="nav-logo">PORTFOLIO</a>

      <nav class="nav-links" aria-label="Hauptnavigation">
        <a routerLink="/about" routerLinkActive="nav-active">Über mich</a>
        <a routerLink="/projects" routerLinkActive="nav-active">Projekte</a>
        <a routerLink="/cv" routerLinkActive="nav-active">Lebenslauf</a>
        <a routerLink="/contact" routerLinkActive="nav-active">Kontakt</a>
      </nav>

      <div class="nav-actions">
        <button id="theme-toggle" aria-label="Dark Mode umschalten" (click)="toggleTheme()">
          @if (isDark()) {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="4" fill="currentColor"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          } @else {
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor"/>
            </svg>
          }
        </button>
        <button
          class="nav-hamburger"
          (click)="toggleMenu()"
          [attr.aria-expanded]="isMenuOpen()"
          aria-label="Menü öffnen"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>

    <!-- Mobile dropdown -->
    @if (isMenuOpen()) {
      <nav class="nav-mobile" aria-label="Mobile Navigation">
        <a routerLink="/about" routerLinkActive="nav-active" (click)="closeMenu()">Über mich</a>
        <a routerLink="/projects" routerLinkActive="nav-active" (click)="closeMenu()">Projekte</a>
        <a routerLink="/cv" routerLinkActive="nav-active" (click)="closeMenu()">Lebenslauf</a>
        <a routerLink="/contact" routerLinkActive="nav-active" (click)="closeMenu()">Kontakt</a>
      </nav>
    }
  </header>

  <!-- Page content -->
  <main class="site-main">
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-cta">
      <h2 class="footer-cta-headline">INTERESSE GEWECKT?</h2>
      <div class="footer-social">
        <a href="https://github.com/Sevynidd" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://www.linkedin.com/in/karina-kock-ab272821a/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; Karina Kock — Full-Stack Softwareentwicklerin</span>
    </div>
  </footer>

</div>
