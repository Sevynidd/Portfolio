@if (lightbox.image(); as img) {
  <div
    class="fixed inset-0 flex items-center justify-center p-6 cursor-zoom-out"
    style="z-index: 200; background: color-mix(in srgb, black 85%, transparent);"
    (click)="lightbox.close()"
  >
    <button
      type="button"
      class="absolute top-6 right-6 text-3xl leading-none"
      style="color: white; opacity: 0.7;"
      aria-label="Schließen"
      (click)="lightbox.close()"
    >&times;</button>
    <img
      [src]="img.src"
      [alt]="img.alt"
      class="max-w-full max-h-full object-contain cursor-default"
      (click)="$event.stopPropagation()"
    >
  </div>
}
